<style>

:root{--ink:#12161C;--paper:#FAF9F6;--red:#EB3B2C;--signal:#C42B1F;--rule:#D8D5CE;--dim:#6E7178;--soft:#EFEDE7;
  --ar:"Plex Ar",system-ui,sans-serif;--mono:"Plex Mono",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--paper);background-image:linear-gradient(rgba(18,22,28,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,22,28,.045) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;color:var(--ink);font-family:var(--ar);font-size:17px;line-height:1.5}
a{color:var(--ink);text-underline-offset:4px}a:hover{color:var(--signal)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono,.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.n{direction:ltr;unicode-bidi:isolate}
.dim{color:var(--dim)}
.wrap{max-width:1120px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:40px}
header{display:flex;justify-content:flex-end;border-bottom:1px solid var(--rule);padding-bottom:12px}
header a{line-height:0}header img{width:170px;height:auto;display:block}
.intro{display:flex;flex-direction:column;gap:8px;max-width:760px}
h1{font-size:44px;font-weight:600;line-height:1.3}
.en{font-family:var(--mono);font-size:14px;color:var(--dim);direction:ltr;text-align:right}
.lead{margin-top:16px}
.search{display:flex;flex-direction:column;gap:6px;max-width:560px}
.search label{font-size:14px;color:var(--dim)}
.search input{font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink)}
.search p{font-size:13px;color:var(--dim);min-height:20px}
.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);padding-bottom:8px}
.line{height:1px;background:var(--ink)}
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--paper);border-bottom:1px solid var(--rule)}
.station{display:flex;flex-direction:column;border-inline-start:1px solid var(--rule);padding-bottom:16px}
.tick{height:14px;position:relative}.tick::before{content:"";position:absolute;inset-inline-start:12px;top:0;width:1px;height:14px;background:var(--ink)}

.big .row{display:flex;align-items:center;gap:8px}
.big .num{font-family:var(--mono);font-size:13px;color:var(--dim);direction:ltr}
.big .ar{font-size:20px;font-weight:600;line-height:1.3}
.big .lat,.small .lat{font-family:var(--mono);font-size:13px;color:var(--dim);direction:ltr}
.inside{margin:4px 12px 0;border-top:1px dashed var(--rule);display:flex;flex-direction:column}
.inside>span{font-size:13px;color:var(--dim);padding:8px 0 4px}
.small{display:flex;align-items:baseline;gap:8px;padding:8px 0;min-height:44px;border:0;background:transparent;text-align:right}
.small .ar{font-size:16px;font-weight:500}
.small[aria-pressed="true"] .ar{font-weight:600}
.faded{opacity:.35}

.reader .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.reader .meta{font-size:14px;color:var(--dim)}
.reader h2{font-size:40px;font-weight:600;line-height:1.25;color:var(--red)}
.reader .lat{font-family:var(--mono);font-size:15px;color:var(--dim);direction:ltr;text-align:right}

.nav button.next{background:var(--ink);color:var(--paper)}

.qs ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.qs li{font-size:15px;padding:6px 12px;border:1px solid var(--rule);background:var(--soft)}
footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:10px;font-size:14px}
footer .links{display:flex;gap:16px;flex-wrap:wrap}
footer .site{font-family:var(--mono);font-size:13px;color:var(--dim);direction:ltr}
noscript p{padding:16px 0}
.lt{font-family:var(--mono);font-size:.88em;direction:ltr;unicode-bidi:isolate}
@media (max-width:560px){h1{font-size:32px}.reader h2{font-size:32px}.plain{font-size:21px}.wrap{padding:24px 16px 48px}}

<section class="intro">
  <h1>ماذا يحدث بين سؤالك وإجابة النموذج؟</h1>
  <p class="en">What happens between your question and the model's answer?</p>
  <p class="lead">عشرة مصطلحات، كلها على طريق واحد. اتبع السؤال من اليمين إلى اليسار، واضغط أي محطة لتقرأها.</p>
</section>

<div class="search">
  <label for="q">ابحث بكلماتك</label>
  <input id="q" type="search" placeholder="مثلًا: لماذا الملف صغير؟ أو ما معنى Q4؟" autocomplete="off">
  <p id="note" aria-live="polite"></p>
</div>

<section aria-label="مسار السؤال">
  <div class="ends"><span>سؤالك ←</span><span>← الإجابة</span></div>
  <div class="line"></div>
  <div class="stations" id="stations"></div>
  <div class="before" id="before"></div>
</section>

<article class="reader" id="reader" aria-live="polite">

</article>

<footer>

</div>

    "before": {
      "id": "finetune",
      "label": "قبل الطريق كله",
      "note": "يغيّر النموذج نفسه، لا طريقة تشغيله."
    }
  },
  "_fields": "questions: shown (formal Arabic). aliases: everyday wordings people type; searched, never shown."
}
</script>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => (s || "")
    .replace(/[​-‏‪-‮⁦-⁩﻿]/g, "")
    .replace(/[ً-ْـ]/g, "")
    .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
    .replace(/[؟?«»]/g, "").toLowerCase().trim();
  const pad = (i) => String(i).padStart(2, "0");
  // English names and numbers inside Arabic text: Plex Mono, left to right (brand book §4)
  const fmt = (s) => String(s).split(/([A-Za-z0-9][A-Za-z0-9.,\-\/ ]*[A-Za-z0-9]|[A-Za-z0-9])/)
    .map((p, i) => (i % 2 ? '<span class="lt">' + esc(p) + "</span>" : esc(p))).join("");

  let D, T = {}, ORDER = [], sel = null, hits = null;

  async function load() {
    try {
      const r = await fetch("../data/glossary.json", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (e) {
      return JSON.parse($("glossary-data").textContent);
    }
  }

  function search(q) {
    const n = norm(q);
    if (!n) return null;
    const words = n.split(/\s+/);
    return ORDER.filter((id) => {
      const t = T[id];
      const hay = norm([t.ar, t.en, t.plain, t.analogy, t.why, (t.questions || []).join(" "), (t.aliases || []).join(" ")].join(" "));
      return words.every((w) => hay.includes(w));
    });
  }

  function btn(id, kind, num) {
    const t = T[id];
    const on = id === sel ? "true" : "false";
    const fade = hits && !hits.includes(id) ? " faded" : "";
    if (kind === "big") {
      return '<button type="button" class="big' + fade + '" data-id="' + id + '" aria-pressed="' + on + '">'
        + '<span class="row"><span class="node" aria-hidden="true"></span><span class="num">' + num + '</span></span>'
        + '<span class="ar">' + esc(t.ar) + '</span><span class="lat">' + esc(t.en) + '</span></button>';
    }
    return '<button type="button" class="small' + fade + '" data-id="' + id + '" aria-pressed="' + on + '">'
      + '<span class="node" aria-hidden="true"></span><span class="ar">' + esc(t.ar) + '</span><span class="lat">' + esc(t.en) + '</span></button>';
  }

  function render() {
    const P = D.path;
    $("stations").innerHTML = P.stations.map((s, i) => {
      let h = '<div class="station"><div class="tick"></div>' + btn(s.id, "big", pad(i + 1));
      if (s.inside) h += '<div class="inside"><span>' + esc(P.inside_label) + '</span>' + s.inside.map((x) => btn(x, "small")).join("") + '</div>';
      return h + '</div>';
    }).join("");
    $("before").innerHTML = '<span>' + esc(P.before.label) + ':</span>' + btn(P.before.id, "small") + '<span>' + esc(P.before.note) + '</span>';

    const t = T[sel];
    const si = P.stations.findIndex((s) => s.id === sel);
    const host = P.stations.find((s) => (s.inside || []).includes(sel));
    const meta = si >= 0 ? '<span class="n">' + pad(si + 1) + '</span> · ' + esc(P.stations[si].where)
      : host ? esc(P.inside_label) : esc(P.before.label);
    $("reader").innerHTML =
      '<div class="top"><div><p class="meta">' + meta + '</p><h2 id="term">' + esc(t.ar) + '</h2><p class="lat">' + esc(t.en) + '</p></div>'
      + '<div class="nav"><button type="button" id="prev">→ السابق</button><button type="button" class="next" id="next">التالي ←</button></div></div>'
      + '<p class="plain">' + fmt(t.plain) + '</p>'
      + '<div class="two"><div><h3>تشبيه</h3><p>' + fmt(t.analogy) + '</p></div><div><h3>لماذا يهمك؟</h3><p>' + fmt(t.why) + '</p></div></div>'
      + '<div class="qs"><h3>أسئلة تقودك إلى هنا</h3><ul>' + (t.questions || []).map((q) => '<li>' + fmt(q) + '</li>').join("") + '</ul></div>';
  }

  function pick(id, push) {
    if (!T[id]) return;
    sel = id;
    render();
    if (push) history.replaceState(null, "", "#" + id);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-id]");
    if (b) { pick(b.dataset.id, true); return; }
    if (e.target.closest("#prev")) pick(ORDER[(ORDER.indexOf(sel) + ORDER.length - 1) % ORDER.length], true);
    if (e.target.closest("#next")) pick(ORDER[(ORDER.indexOf(sel) + 1) % ORDER.length], true);
  });

  $("q").addEventListener("input", (e) => {
    hits = search(e.target.value);
    const n = $("note");
    if (!hits) n.textContent = "";
    else if (hits.length) { n.textContent = hits.length + " من " + ORDER.length + " · الأقرب: " + T[hits[0]].ar; sel = hits[0]; }
    else n.textContent = "لا يوجد مصطلح مطابق بعد. اقترحه علينا من الرابط في الأسفل.";
    render();
  });

  window.addEventListener("hashchange", () => pick(location.hash.slice(1), false));

  load().then((data) => {
    D = data;
    data.terms.forEach((t) => { T[t.id] = t; });
    const P = data.path;
    P.stations.forEach((s) => { ORDER.push(s.id); (s.inside || []).forEach((x) => ORDER.push(x)); });
    ORDER.push(P.before.id);
    const h = decodeURIComponent(location.hash.slice(1));
    sel = T[h] ? h : "token";
    render();
  });
})();
</script>
</body>
</html>
