id: qt-04-silma-9b-clinic
type: quick-trial            # numbers only, no verdict (standard v1.2)
status: preregistered
approved_by: Mahmoud Deghaim
approved_on: 2026-11-12
standard: Job Trial Standard v1.2   # fair shot
job: clinic-frontdesk
question_ar: هل يستطيع SILMA 9B أن يدير استقبال عيادة؟
models: [silma-9b]
model_source: silma-ai/SILMA-9B-Instruct-v1.0 at revision d8f4d2b11a71e10f4231d38f0a343ee49715f392 (Hugging Face, checked 12 Nov 2026)
catch_up_check: >
  Released 17 Aug 2024 (last updated 25 Jun 2025), so this is a catch-up check of an existing model, not a check
  within days of a release; the page says so.
why_this_model: >
  Neutrality rule: Inception (Jais), HUMAIN/SDAIA (ALLaM), TII (Falcon) and QCRI (Fanar) have been tested; SILMA AI
  (Saudi Arabia) has not. SILMA 9B is SILMA's open Arabic model (card languages ar and en; Arabic stated on the card),
  built on Gemma 2 (architecture Gemma2ForCausalLM in config.json; the card does not name the base model).
licence: >
  Gemma terms (licence tag and card); they allow evaluation and publication of results. The LICENSE file and the
  Gemma prohibited-use policy are read before publishing.

setups:                       # all three Job Trial #1 setups, every one reported, no best-of selection
  thinking_off: [base, table, tool]   # tool = common setup (headline); the model has no thinking mode
headline_setup: tool
tool_path: >
  Prompted-JSON adapter (--mode prompted), decided before any answer is read: SILMA's chat template has no tool
  support (rendered on 12 Nov: tool definitions and tool results are dropped; only user and assistant turns are
  formatted). Through the adapter the tool list is in the system prompt, the model's calls are JSON text that stays
  in the history, and tool results return as user messages, so turns alternate as the template expects.
  The template keeps the system prompt, printed before the first turn. The adapter's effect is reported from two
  calibrations, Qwen3 4B (qt-02: +6.3 points) and Falcon-H1 7B (cal-02); it is never subtracted from SILMA's numbers.
sampling: silma               # model card example: temperature 1.0, the only value the card gives; generation_config.json at
                              # the pinned revision sets no sampling values (amendment 1); other samplers neutral (top_p 1.0,
                              # top_k off, min_p 0, no penalties)
window_tokens: 8192           # the model's stated context length (max_position_embeddings 8192; sliding window 4096)
generation_cap_tokens: 4096   # half the window, leaving room for the prompt (longest earlier conversations ~2,000 tokens);
                              # a request that no longer fits counts as a failure with flag "context", reported separately
quant: Q4_K_M                 # no official GGUF from SILMA: self-converted from the pinned safetensors with llama.cpp
                              # convert_hf_to_gguf.py + llama-quantize; sha256 recorded
runtime: llama.cpp 7df8b87    # same build as qt-02r and cal-02, where the adapter calibration is measured
test_set: public_test         # the private held-out set is not written yet; the page says "public test set only"
repeats: 3                    # + 2 extra reps on the 9 safety episodes, as in every earlier trial
dev_pilot: >
  12 DEV episodes, tool setup, 1 rep, before the test run (no test-split output): checks that the first prompt carries
  the tool list (prompt tokens), that replies parse as JSON and that tool calls occur. Its output is kept in
  results/qt04/pilot-*, never scored as a result. If the pilot shows 0 tool calls or the instructions missing from the
  prompt, the test run waits and the cause is fixed by an amendment registered before the test.
machines:
  run: runpod-4090
  speed: none                 # laptop floor not measured in this Quick Trial; the page says so
budget_usd: 5                 # expected about USD 3 (conversion + pilot + 3 setups)
stop_rules: >
  Nothing is published if: the oracle replay is below 100%; the pilot shows 0 tool calls with no documented fix; the
  prompt lacks the instructions or tools; setups are mislabelled; or any change is made after seeing test scores. A
  harness fault found after publication gets a pre-registered re-run published beside the original numbers (as qt-02).
publish: [results.json, raw interactions (phone-like numbers redacted, re-scored), numbers-only page, X thread]
preregistration_commit: null  # the commit that adds this file

amendments:
  - date: 2026-11-13
    when: after setup, before the DEV pilot and before any test run (no SILMA output seen)
    what: >
      Wording correction: the pinned revision does contain a generation_config.json, but it sets no sampling values
      (only bos_token_id 2, eos_token_id 1, pad_token_id 0, cache_implementation "hybrid"). The registered sampling
      is unchanged: temperature 1.0 from the model card example, other samplers neutral.
  - date: 2026-11-13
    when: after the DEV pilot, before any test run (no test-split output seen)
    what: >
      The DEV pilot (12 runs, kept in results/qt04/pilot-silma-9b-q4-qt04) showed a first prompt of 13 tokens and 3 tool
      calls: the system prompt, with the clinic instructions and the tool list, did not reach the model. SILMA's
      template stores the system prompt in a variable set inside an if block and prints it later; llama.cpp's template
      engine drops it, while the reference engine (Jinja2, used for the template check) keeps it. Fix, following qt-03
      amendment 1: llama-server gets a template that prints the system prompt directly (scripts/fix_silma_template.py),
      checked to render exactly the same text as the original with Jinja2 on six renders, including the adapter's
      multi-turn shape; both files are saved in results/qt04/. Nothing else changes. A second DEV pilot must show the
      instructions in the first prompt (hundreds of tokens) before the test; the test step refuses to run without the fix.
  - date: 2026-11-13
    when: after the second DEV pilot, before any test run (no test-split output seen)
    what: >
      Correction to amendment 2: its diagnosis was wrong. The pilot check printed the smallest count of new prompt
      tokens, and llama.cpp reuses the cached start of the prompt between runs, so "13" was only the uncached tail. The
      stored runs show the full first prompt reached the model in pilot 1: 1,726 tokens in run 1 with nothing cached,
      1,721 to 1,734 in every run including the cached part. The original template already kept the system prompt.
      The template written for amendment 2 renders exactly the same text, so it stays in use and changes nothing.
      The pilot check now prints the full first prompt (new plus cached tokens). The low number of tool calls in the
      pilots (3 in 12 runs) is the model's behaviour with the instructions present, not a harness fault; the test runs
      as registered.
results: null
