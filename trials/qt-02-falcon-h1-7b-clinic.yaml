id: qt-02-falcon-h1-7b-clinic
type: quick-trial            # numbers only, no verdict (standard v1.2)
status: run-complete       # results in, publication pending (numbers only)
approved_by: Mahmoud Deghaim
approved_on: 2026-10-29
standard: Job Trial Standard v1.2   # fair shot
job: clinic-frontdesk
question_ar: هل يستطيع Falcon-H1 7B أن يدير استقبال عيادة؟
models: [falcon-h1-7b-instruct]
why_this_model: >
  Neutrality rule: next lab after G42/Inception (Jais) and HUMAIN/SDAIA (ALLaM). TII's Arabic-specific models
  (Falcon-H1-Arabic, Falcon-Arabic) have no downloadable weights (checked 29 Oct 2026), so they fall outside the
  inclusion rule; Falcon-H1-7B-Instruct is TII's open model with Arabic among its 18 trained languages.
setups: [base, table, tool]  # all three Job Trial #1 setups (window allows); every one reported, no best-of selection
headline_setup: tool         # common setup (standard v1.2): date tool, no thinking (the model has no thinking mode)
adapter_rule: >
  Decided by a probe before any model answer is read (scripts/run_qt02.sh probe_adapter): the same first request is
  sent with and without the tool list (max_tokens 1). If the tools add >= 200 prompt tokens, llama.cpp's native tool
  calling is used (--mode chat, as for Qwen3 in Job Trial #1); otherwise the prompted-JSON adapter (--mode prompted,
  as for ALLaM in qt-01). The probe result is saved in results/qt02/adapter.txt and reported.
sampling: falcon-h1           # TII README: temperature 0.1 (higher values may drop performance); top_p 1.0, top_k off, min_p 0, no penalties
window_tokens: 32768          # same as Job Trial #1
generation_cap_tokens: 8192   # same as Job Trial #1; a cap counts as a failure
quant: Q4_K_M                 # official GGUF from tiiuae/Falcon-H1-7B-Instruct-GGUF if present, else self-converted; sha256 recorded
test_set: public_test         # the private held-out set is not written yet; the report says "public test set only"
repeats: 3                    # + 2 extra reps on safety episodes, as in Job Trial #1 and qt-01
pilot: DEV split, 12 episodes, 1 rep, tool setup; checks adapter, first-prompt size, tool calls, parse failures before the test run
extras:                      # same pod session, test split, tool setup, 3 reps + 2 safety reps, exact Job Trial #1 GGUFs (sha256 checked)
  adapter_calibration: >
    Qwen3 4B, no thinking, run twice on the same llama.cpp build: native tool calling vs the prompted-JSON adapter.
    The difference in episode success is the adapter's measured cost; it is published and cited next to every adapter
    result, including qt-01 (ALLaM). If the cost is material, the ALLaM page gets a dated correction note.
  common_setup_rows: [Qwen3 8B no thinking, Jais 3 7B low effort]   # missing like-for-like rows from Job Trial #1

machines:
  run: runpod-4090
  speed: none                 # laptop (floor) wait not measured in this Quick Trial; stated on the results page
comparison: common setup table for every model measured so far (Jais 3 3.7B/7B low, Qwen3 4B/8B off, ALLaM 7B, Falcon-H1 7B), rows chosen by setup, never by lab; Falcon's base/table setups shown next to Job Trial #1's same setups
risks:
  - hybrid attention + Mamba architecture: needs a recent llama.cpp; the setup step stops if the server fails to load it.
  - general multilingual model, not Arabic-specific: the page says so.
  - licence (TII Falcon licence, Apache-2.0-based with an acceptable-use policy): LICENSE file saved by setup and read before publishing.
publish: [results page on miqyaslab.com, results.json, redacted raw interactions, numbers-only scorecard, X thread, Hugging Face discussion]
publication_checklist: [redact phone-like numbers and re-score, recompute numbers from raw data, read a random sample of failures, link to the miqyaslab.com page]
preregistration_commit: 7397aae

amendments:
  - date: 2026-10-29
    when: after the DEV pilot, before any TEST run (no test-split output seen)
    what: >
      Tool-call reading extended to the format documented in the model's own chat template. Reason: the probe showed
      the tools reach the prompt (521 -> 1,557 tokens, native path chosen as pre-registered), but the DEV pilot recorded
      0 tool calls in 12 runs: Falcon-H1 writes calls as {'arguments': {...}, 'name': ...} (its template's documented
      schema, Python-style quotes, often without the <tool_call> tags), which llama.cpp's parser does not recognise.
      New mode (scripts/run_v2.py --mode template): llama.cpp native tool calling first; when it returns no call, every
      top-level {...} in the reply that parses into exactly {name: str, arguments: dict} is read as a call and removed
      from the reply text. Validated before use: oracle replay in Falcon's text format identical on 162/162
      episode-setups; look-alike text is not read as a call. Pilot 1 kept in results/qt02/pilot-falcon-h1-7b-q4-qt02;
      a second DEV pilot runs before the TEST run. Adapter calibration and reference rows unchanged.
  - date: 2026-11-12
    when: after publication; registered before any re-run output exists
    what: >
      Harness fault found in our review: Falcon-H1's chat template prints each message's content only and never an
      assistant message's tool_calls field (checked by rendering the template from tiiuae/Falcon-H1-7B-Instruct). In
      template mode the runner removed the call text from the reply and kept the call only in tool_calls, so in every
      setup Falcon saw empty assistant turns of its own followed by tool results it had no record of requesting. This
      is the fault found and fixed for Fanar in qt-03 (amendment 2) before its test run; qt-02 ran before that fix.
      Re-run (results/qt02r/): all three setups, test split, 3 reps + 2 safety reps, same official GGUF (sha256 as in
      results/qt02/model_provenance.txt), same llama.cpp build 7df8b87, same sampling and window. The only change is
      the history: the call text stays in the assistant message exactly as the model wrote it (scripts/run_v2.py,
      qt-03 amendment 2). Reported next to the original numbers, which stay on the page; the re-run becomes Falcon's
      row in the common-setup table, labelled.

results:                       # TEST split, public test set only; all numbers in findings/qt02-falcon-h1-7b/results.json
  run_date: 2026-10-29
  run_commit: 2a223ef          # runner with amendment 1; llama.cpp 7df8b87; official GGUF sha256 in results/qt02/model_provenance.txt
  falcon_episode_success: {base: 18.3%, table: 21.4%, tool: 14.3%}   # tool = common-setup headline; 95% CI tool 5.6-24.6%
  rerun_2026_11_12:            # amendment of 2026-11-12 (harness fault); results/qt02r/; same GGUF, llama.cpp 7df8b876b, runner 7fe65a3
    falcon_episode_success: {base: 18.3%, table: 37.3%, tool: 25.4%}   # these replace the first run; 95% CI tool 14.3-37.3%
    change_vs_first_run_points: {base: 0.0, table: +15.9, tool: +11.1}  # 95% CI paired by episode: base -4.8..6.3, table 7.9..25.4, tool 4.0..19.8
    falcon_emergencies_in_time: {base: 3/25, table: 11/25, tool: 13/25}
  falcon_emergencies_in_time: {base: 5/25, table: 6/25, tool: 8/25}
  falcon_observations: >
    Tool calls arrive only as text in the template-documented format (0 parsed natively). 5-13 runs per setup contain a
    malformed call attempt (not read, counted as the model's error); 39-50 runs per setup contain an English-only reply.
    Typical failures (10 read): says it will transfer an emergency without calling the tool, misses Gulf date words
    («عقب باجر»), books the wrong weekday, replies in English, stray Japanese text. No invented phone numbers.
  adapter_calibration: "Qwen3 4B no thinking, same build: native 29.4%, prompted-JSON adapter 35.7% (+6.3 points). The adapter does not handicap; the ALLaM result stands."
  common_setup: "Jais 3 7B low 69.8% · Qwen3 8B off 68.3% · Qwen3 4B off 29.4% · Jais 3 3.7B low 28.6% (Job Trial #1) · Falcon-H1 7B 14.3% · ALLaM 7B 8.7% (qt-01)"
  invented_phone_runs_tool_setup: {allam: 21/144, qwen3_4b_native: 2/144, others: 0/144}
  redaction: "phone-like numbers redacted in qt-02 transcripts (Qwen3 4B calibration only) and, retroactively, in 3 Job Trial #1 Qwen3 4B runs; scores re-computed, identical"
  licence: "TII Falcon licence (Apache-2.0-based; no restriction on publishing evaluations)"
  ops_bug: "test->extras chain blocked by the run lock held by the exiting server; extras started by hand, no data affected"
