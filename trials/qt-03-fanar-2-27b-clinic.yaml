id: qt-03-fanar-2-27b-clinic
type: quick-trial            # numbers only, no verdict (standard v1.2)
status: run-complete         # results in, publication pending (numbers only)
approved_by: Mahmoud Deghaim
approved_on: 2026-11-05
standard: Job Trial Standard v1.2   # fair shot
job: clinic-frontdesk
question_ar: هل يستطيع Fanar 2 27B أن يدير استقبال عيادة؟
models: [fanar-2-27b-instruct]
model_source: QCRI/Fanar-2-27B-Instruct at revision 074005040e9c3511b1c43b4298bef09908285534 (HF, checked 5 Nov 2026)
why_this_model: >
  Neutrality rule: the last three publications were G42/Inception (Jais), HUMAIN/SDAIA (ALLaM) and TII (Falcon);
  QCRI (Qatar) is untested. Fanar 2 27B is QCRI's open Arabic-English model (Apache-2.0), built by continual
  pretraining of Google's gemma-3-27b-pt on ~166B Arabic/English/code tokens; the page says it is Gemma-based.
  The card claims selective thinking with native Arabic reasoning and generic tool calling.

setups:                       # all three Job Trial #1 setups, every one reported, no best-of selection
  thinking_off: [base, table, tool]   # tool + thinking off = common setup (headline)
  thinking_on: [tool]                 # the model's own best in the setup that the Job Trial #1 full-thinking line uses
headline_setup: tool, thinking off
thinking_switch: >
  Fanar's template uses chat_template_kwargs {"no_thinking": true|false}; thinking is ON by default. The runner
  sends both switches (no_thinking and enable_thinking) so each template reads its own; validated in the DEV pilot
  by checking that thinking-off replies contain no <think> block and thinking-on replies do. Reasoning language
  (Arabic vs English) is recorded, as in Job Trial #1.
tool_path_rule: >
  Decided before any test-split answer is read, in this order: (1) probe: the same first request with and without
  the tool list (max_tokens 1); if the tools add >= 200 prompt tokens, llama.cpp native tool calling (--mode chat).
  (2) If the DEV pilot then records 0 native tool calls, the template-documented reader (--mode template, qt-02
  amendment 1) when the model's template documents a call format. (3) Otherwise the prompted-JSON adapter
  (--mode prompted; measured cost +6.3 points on Qwen3 4B, qt-02). The path taken is saved in results/qt03/adapter.txt.
sampling: fanar-2             # README (vLLM example): temperature 0.7, the only value the card gives; other values from
                              # generation_config.json at the pinned revision if it sets them, else llama.cpp neutral
                              # (top_p 1.0, top_k off, min_p 0, no penalties). Recorded in meta.json before the pilot.
window_tokens: 32768          # same as Job Trial #1; equals the model's stated context length
generation_cap_tokens: 8192   # same as Job Trial #1; a cap counts as a failure
quant: Q4_K_M                 # no official GGUF from QCRI: self-converted from the pinned safetensors with llama.cpp
                              # convert_hf_to_gguf.py + llama-quantize; llama.cpp commit and sha256 recorded
test_set: public_test         # the private held-out set is not written yet; the page says "public test set only"
repeats: 3                    # + 2 extra reps on safety episodes, as in Job Trial #1, qt-01 and qt-02
pilot: DEV split, 12 episodes, 1 rep, tool setup, thinking off and on; checks load, first-prompt size, thinking switch, tool calls, parse failures

machines:
  run: runpod-4090
  fallback_rule: >
    If the Q4_K_M model with a 32,768-token window does not load on the 24 GB RTX 4090, the run moves to a 48 GB card
    (RTX A6000 or L40S), decided at setup before any answer is read. Wait times are reported for the card used.
  speed: none                 # laptop (floor) wait not measured; a 27B model does not fit 8 GB; stated on the page
budget_usd: 15                # expected ~7-8 GPU-hours on the RTX 4090 incl. conversion (~USD 5-6); thinking-on runs are the long part
comparison: common-setup table for every model measured so far (Jais 3 7B/3.7B low, Qwen3 8B/4B off, Falcon-H1 7B, ALLaM 7B, Fanar 2 27B), rows chosen by setup, never by lab; the size difference (27B vs 3.7-8B) stated next to the table
risks:
  - size: 27B against 4-8B rows; the page states the size gap and the memory it needs (cannot run on the floor laptop).
  - thinking default ON; a wrong switch would mislabel setups. The pilot check above stops the run if the switch fails.
  - card says not suitable for high-stakes medical advice; the job is clinic admin with handover to staff, so the card is quoted on the page.
  - licence: Apache-2.0 on the card; an open HF discussion asks whether Gemma 3's use policy also applies. Neither restricts publishing an evaluation; noted on the page.
publish: [results page on miqyaslab.com, results.json, redacted raw interactions, numbers-only scorecard, X thread, Hugging Face discussion]
publication_checklist: [redact phone-like numbers and re-score, recompute numbers from raw data, read a random sample of failures, results page and any notes live before the thread, link to the miqyaslab.com page]
preregistration_commit: 10c86b5

amendments:
  - date: 2026-11-05
    when: during setup, before the pilot (no model answer read)
    what: >
      llama.cpp's Jinja engine rejects Fanar's chat template ("Unknown statement: raw"): the template uses {% raw %}
      blocks, which only print their contents literally. scripts/fix_raw_template.py replaces each raw block with an
      equivalent string expression and the server loads the result with --chat-template-file. The converted template
      is used only if it renders byte-identical to the original (Python jinja2, Hugging Face settings) on test
      conversations with and without tools, a tool call and result, thinking on and off, with and without a generation
      prompt; otherwise setup stops. Original and converted templates saved in results/qt03/. Nothing else changes.
  - date: 2026-11-05
    when: after two DEV pilots, before any TEST run (no test-split output seen)
    what: >
      Tool path, as pre-registered: the probe chose native (569 -> 1,409 prompt tokens with tools), but DEV pilot 1
      recorded 0 native calls while 56 of 70 replies held calls in the template's documented <tool_call>{name,
      arguments}</tool_call> format, so pilot 2 used the template reader (rule step 2). Pilot 2 showed silent turns
      caused by history rendering, not by the model: Fanar's template prints an assistant message's content only and
      never its tool_calls field, so with the call text removed the model saw an empty turn of its own followed by
      tool results it had not asked for. Change (scripts/run_v2.py, template mode only): the assistant message in the
      history keeps the call text exactly as the model wrote it; the patient-facing reply is unchanged (tags and calls
      removed). Validated: self-tests pass; a third DEV pilot (PILOT_TAG=3) runs before the TEST run. Pilots 1 and 2
      kept in results/qt03/. Thinking on: the model wrote no reasoning in 100 pilot steps (selective thinking); the
      thinking-on setup runs as pre-registered and is reported as the model's own choice.
  - date: 2026-11-05
    when: after DEV pilot 3, before any TEST run
    what: >
      Pilot 3 (amendment 2 in place) showed <think> blocks in 2 patient replies: Fanar's template prefills the empty
      thinking block only after a patient message, not after a tool result, and llama.cpp's reasoning parser does not
      recognise this template, so reasoning stayed in the reply text. Change (template mode only): a closed
      <think>...</think> block is moved from the reply to the reasoning record, as llama.cpp does for recognised
      templates. Unclosed blocks are not touched. Validated on sample replies and self-tests; a fourth DEV pilot
      (PILOT_TAG=4) runs before the TEST run.
  - date: 2026-11-05
    when: after DEV pilot 4, before any TEST run
    what: >
      Correction to amendment 3: the two flagged replies in pilots 3 and 4 were the malformed tag "</think_call>"
      (Fanar's own garbled closing tool tag), not reasoning. No reasoning reached a patient reply in any pilot.
      Amendment 3 stays in the runner (it changed nothing in pilot 4, which matches pilot 3 exactly under fixed
      seeds); the malformed tag is the model's own output and is scored as written. Pilot checks pass; TEST next.

results:                       # TEST split, public test set only; all numbers in findings/qt03-fanar-2-27b/results.json
  run_date: 2026-11-05
  run_commit: f4423d2          # runner with amendments 1-3; llama.cpp 9c9074e; self-converted Q4_K_M, sha256 in results/qt03/model_provenance.txt
  machine: RunPod RTX 4090 (24 GB); fits with the 32,768 window, no fallback card needed
  fanar_episode_success: {base: 53.2%, table: 79.4%, tool: 54.8%, tool_thinking_on: 50.8%}   # tool (thinking off) = common-setup headline; 95% CI 43.7-65.9%
  fanar_emergencies_in_time: {base: 25/25, table: 25/25, tool: 24/25, tool_thinking_on: 24/25}
  fanar_complaint_medical_handed_over: {base: 20/20, table: 20/20, tool: 18/20, tool_thinking_on: 19/20}
  thinking: 0 of 1,416 steps with reasoning when thinking was allowed (selective thinking; the model never chose to think in this job)
  fanar_observations: >
    Read 8 random tool-setup failures. Typical: wrong date arithmetic for Gulf day words («الثلاثاء الياي» -> a
    Thursday), loops repeating the same rejected call (dates in Arabic-Indic digits or a wrong year), books a new
    reschedule slot without cancelling the old one then says it was cancelled, invents a patient name ("Test User"),
    tells the patient which tools it used, malformed tags in replies (e.g. "</think_call>"). No invented phone numbers.
  post_hoc_half_hour: >
    Not pre-registered, counted after reading failures: after a patient wrote «X ونص», 8 of 31 booking calls (tool
    setup) used the whole hour (e.g. «7 ونص» -> 19:00); 3 wrote the time in Arabic-Indic digits. Qwen3 8B 0/35 and
    Jais 3 7B 0/33 in the same setup.
  falcon_history_check: >
    Amendment 2 raised whether Falcon (qt-02, same template reader) was also handicapped by history rendering. Falcon's
    template could not be read from here; behaviourally, Falcon shows 0% empty replies after a tool call (Fanar with
    hidden call text: 8%) and 3% exact repeat calls (Qwen3 4B native: 3%). No sign of the same handicap; to confirm
    from Falcon's template at the next pod session.
  redaction: no phone-like numbers in qt-03 replies (dates excluded); nothing redacted
  licence: "Apache-2.0 (model card); no restriction on publishing evaluations"
  cost_usd: ~6                 # estimate (~8 pod-hours at 0.74 incl. build, download and pilots); confirm from RunPod billing

